name: "Build and push container image"


on:
  push:
    branches: ["*"]
    tags: ["*"]
  schedule:
    - cron: "0 9 * * *"


jobs:
  main:
    runs-on: "ubuntu-latest"
    env:
      PUBLISH: ${{ github.repository == 'ricardbejarano/haproxy' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/')) }}
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7.0.1"

      - name: "Login to Docker Hub"
        if: env.PUBLISH == 'true'
        uses: "docker/login-action@v4.8.0"
        with:
          registry: "docker.io"
          username: "${{ secrets.DOCKER_HUB_USERNAME }}"
          password: "${{ secrets.DOCKER_HUB_PASSWORD }}"

      - name: "Login to RedHat Quay"
        if: env.PUBLISH == 'true'
        uses: "docker/login-action@v4.8.0"
        with:
          registry: "quay.io"
          username: "${{ secrets.REDHAT_QUAY_USERNAME }}"
          password: "${{ secrets.REDHAT_QUAY_PASSWORD }}"

      - name: "Set up QEMU"
        uses: "docker/setup-qemu-action@v4.4.0"

      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@v4.4.1"

      - name: "Build container image"
        uses: "nick-fields/retry@v4.0.0"
        with:
          max_attempts: 3
          timeout_minutes: 30
          command: |
            docker buildx build \
              --platform "linux/amd64" \
              ${{ env.PUBLISH == 'true' && '--push' || '--load' }} \
              --tag "docker.io/${{ github.repository }}:latest" \
              --tag "docker.io/${{ github.repository }}:${{ github.ref_name }}" \
              --tag "quay.io/${{ github.repository }}:latest" \
              --tag "quay.io/${{ github.repository }}:${{ github.ref_name }}" \
              .
